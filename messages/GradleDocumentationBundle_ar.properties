# Arabic (ar) translation for messages/GradleDocumentationBundle_ar.properties (v0.6)
gradle.cmd.option.build.cache=يفعّل ذاكرة التخزين المؤقت لبناء Gradle. سيحاول Gradle إعادة استخدام مخرجات عمليات البناء السابقة.
