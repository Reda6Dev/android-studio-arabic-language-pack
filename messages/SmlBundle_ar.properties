sml.studiobot.timeline.emptyState.agentMode.accessAi.consumer.markdown=**المزيد من طرق الوصول إلى AI**\n\n[الترقية إلى خطة Google AI مؤهلة]({0})↗ للوصول إلى Gemini بالاشتراك، أو وفّر مفاتيح API لاستخدام [Anthropic]({1}) و[OpenAI]({2}) و[Gemini عبر AI Studio]({3}). وللتطوير دون اتصال بالإنترنت، شغّل [النماذج المحلية]({4}) عبر مضيفي LLM المحليين.
sml.studiobot.timeline.emptyState.agentMode.accessAi.enterprise.markdown=**المزيد من طرق الوصول إلى AI**\n\nإذا كانت مؤسستك توفّر الوصول، فيمكنك إضافة مفاتيح API لاستخدام [Anthropic]({0}) و[OpenAI]({1}) و[Gemini عبر AI Studio]({2}). وللتطوير دون اتصال بالإنترنت، يمكنك تشغيل [النماذج المحلية]({3}) عبر مضيفي LLM المحليين.
