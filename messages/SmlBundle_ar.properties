sml.studiobot.advertiser.description.aqi=سجّل الدخول إلى Gemini للحصول على مساعدة في استكشاف الأخطاء وإصلاحها وتحسين تطبيقك عبر تقديم تحليلات وحلول للأعطال وحالات ANR.
sml.studiobot.advertiser.description.buildErrors=سجّل الدخول إلى Gemini للحصول على مساعدة في استكشاف أخطاء البناء غير المتوقعة وإصلاحها وتحسين تكوين البناء.
sml.studiobot.advertiser.description.documentFunction=سجّل الدخول إلى Gemini للحصول على اقتراحات لتوثيق الكود ومراجعة التغييرات المقترحة وقبول التغييرات مباشرةً في محرر الكود.
sml.studiobot.advertiser.description.explainCode=سجّل الدخول إلى Gemini للحصول على شروحات تفصيلية لما يفعله الكود ومعرفة كيفية مساهمته في مظهر تطبيقك أو سلوكه.
sml.studiobot.advertiser.description.generateCode=سجّل الدخول إلى Gemini للحصول على اقتراحات الكود ومقارنة فروقات الكود وقبول التغييرات مباشرةً في محرر الكود.
sml.studiobot.advertiser.description.generateUnitTestScenarios=سجّل الدخول إلى Gemini للحصول على اقتراحات لما يجب اختباره باختبارات الوحدة، بما في ذلك أسماء الاختبارات والأوصاف التفصيلية.
sml.studiobot.advertiser.description.journeys=سجّل الدخول إلى Gemini لتشغيل وتسجيل الاختبارات الشاملة باستخدام مطالبات باللغة الطبيعية.
sml.studiobot.advertiser.description.promptLibrary=سجّل الدخول إلى Gemini لحفظ وإدارة مطالباتك المفضلة على مستوى IDE أو على مستوى المشروع.
sml.studiobot.advertiser.description.rethinkVariables=سجّل الدخول إلى Gemini للحصول على اقتراحات لأسماء المتغيرات أو الدوال في ملف، وقبول الأسماء التي تناسبك.
sml.studiobot.advertiser.description.stateInspection=سجّل الدخول إلى Gemini للحصول على مساعدة في شرح قراءات حالة إعادة التركيب.
sml.studiobot.advertiser.description.suggestCommitMessage=بمجرد ربط نظام التحكم بالإصدارات ببيئة Android Studio، سجّل الدخول إلى Gemini للحصول على اقتراحات لرسالة Commit استناداً إلى تغييرات الكود الأخيرة وعمليات Commit السابقة.
sml.studiobot.advertiser.description.suggestImprovements=سجّل الدخول إلى Gemini للحصول على اقتراحات حول كيفية تحسين تطبيقك باستخدام أحدث ميزات Android وكيفية تنظيم كودك بشكل أفضل.
sml.studiobot.advertiser.description.transformCode=سجّل الدخول إلى Gemini وشارك السياق لاستخدام ميزة التحويل للحصول على اقتراحات الكود أو تحسين كودك أو إضافة كود إلى تطبيقك.
sml.studiobot.advertiser.description.uiTools=سجّل الدخول إلى Gemini لإنشاء واجهة المستخدم وتعديلها وإصلاح مشاكل الواجهة وتوليد المعاينات.
